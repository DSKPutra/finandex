<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="ReksaDex">
  <title>ReksaDex</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121B15"/><stop offset="1" stop-color="#040705"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.72" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#19F23A" stop-opacity="0.16"/><stop offset="1" stop-color="#19F23A" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#halo)"/>
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2"/>

  <circle cx="256" cy="256" r="112" fill="none" stroke="#EEF3EF" stroke-opacity="0.22" stroke-width="58"/>
  <circle cx="256" cy="256" r="112" fill="none" stroke="#EEF3EF" stroke-width="58" stroke-dasharray="380 324" transform="rotate(-90 256 256)"/>
  <circle cx="256" cy="256" r="112" fill="none" stroke="#19F23A" stroke-width="58" stroke-dasharray="190 514" stroke-dashoffset="-392" transform="rotate(-90 256 256)" filter="url(#glow)"/>
  <circle cx="256" cy="256" r="26" fill="#FFFFFF"/>
</svg>
