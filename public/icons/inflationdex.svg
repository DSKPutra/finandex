<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="InflationDex">
  <title>InflationDex</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121B15"/><stop offset="1" stop-color="#040705"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.72" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#19F23A" stop-opacity="0.16"/><stop offset="1" stop-color="#19F23A" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#halo)"/>
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2"/>

  <circle cx="196" cy="196" r="40" fill="none" stroke="#EEF3EF" stroke-width="22"/>
  <circle cx="316" cy="316" r="40" fill="none" stroke="#EEF3EF" stroke-width="22"/>
  <line x1="330" y1="150" x2="182" y2="362" stroke="#EEF3EF" stroke-width="24" stroke-linecap="round"/>
  <g filter="url(#glow)"><line x1="396" y1="276" x2="396" y2="118" stroke="#19F23A" stroke-width="20" stroke-linecap="round"/>
  <polyline points="364,150 396,118 428,150" fill="none" stroke="#19F23A" stroke-width="20" stroke-linecap="round" stroke-linejoin="round"/></g>
</svg>
