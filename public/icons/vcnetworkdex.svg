<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="VCNetworkDex">
  <title>VCNetworkDex</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#121B15"/><stop offset="1" stop-color="#040705"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.72" cy="0.28" r="0.75">
      <stop offset="0" stop-color="#19F23A" stop-opacity="0.16"/><stop offset="1" stop-color="#19F23A" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" filterUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <feGaussianBlur in="SourceGraphic" stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" rx="116" fill="url(#bg)"/>
  <rect width="512" height="512" rx="116" fill="url(#halo)"/>
  <rect x="2" y="2" width="508" height="508" rx="114" fill="none" stroke="#FFFFFF" stroke-opacity="0.07" stroke-width="2"/>

  <g stroke="#EEF3EF" stroke-width="10" stroke-opacity="0.7"><line x1="160" y1="170" x2="256" y2="256"/><line x1="352" y1="160" x2="256" y2="256"/><line x1="150" y1="350" x2="256" y2="256"/><line x1="362" y1="352" x2="256" y2="256"/><line x1="160" y1="170" x2="352" y2="160"/><line x1="150" y1="350" x2="362" y2="352"/></g>
  <line x1="256" y1="256" x2="362" y2="352" stroke="#19F23A" stroke-width="12" filter="url(#glow)"/>
  <circle cx="160" cy="170" r="28" fill="#EEF3EF"/><circle cx="352" cy="160" r="24" fill="#EEF3EF"/><circle cx="150" cy="350" r="24" fill="#EEF3EF"/>
  <circle cx="256" cy="256" r="40" fill="#EEF3EF"/><circle cx="362" cy="352" r="30" fill="#19F23A" filter="url(#glow)"/>
