# Lighthouse CI (§14/§18): mobile Home ≥ 90 in all four categories. Separate workflow so a performance regression is
# visible without blocking promotion of an otherwise green build (see docs/FINAL_REPORT.md for the current gap).
name: lighthouse
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions:
  contents: read
jobs:
  lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATA_INPUTS_RELEASE_TAG: ${{ vars.DATA_INPUTS_RELEASE_TAG || 'data-inputs-v1' }}
      GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
        with: { persist-credentials: false }
      - uses: actions/setup-node@v4
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
      - run: npm run data:fetch && npm run data:verify && npm run data:extract && npm run data:build
      - run: npm run build
      - run: npm run lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: lighthouse, path: .lighthouseci/, if-no-files-found: ignore }
