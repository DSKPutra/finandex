# Fast-forward `release` (production branch of Vercel & Netlify) to a green `main` commit (§15.2).
name: promote
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [main]
permissions:
  contents: write
jobs:
  promote:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - name: Fast-forward release
        env: { SHA: '${{ github.event.workflow_run.head_sha }}' }
        run: |
          git fetch origin release || true
          if git rev-parse --verify origin/release >/dev/null 2>&1; then
            git merge-base --is-ancestor origin/release "$SHA" || { echo "release is not an ancestor of $SHA; refusing non-fast-forward"; exit 1; }
          fi
          git push origin "$SHA:refs/heads/release"
