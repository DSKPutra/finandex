# CI (§15.7): install → fetch inputs (cached by input manifest SHA-256) → build data → `npm run verify`.
name: ci
on:
  push:
    branches: [main, release]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      DATA_INPUTS_RELEASE_TAG: data-inputs-v1
      GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || github.token }}
      CHAT_MODE: mock
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Cache dataset inputs
        uses: actions/cache@v4
        with:
          path: data/inputs
          key: inputs-${{ hashFiles('kit/manifest/input_files_manifest.json') }}
      - run: npm run data:all
      - run: npx playwright install --with-deps chromium firefox webkit
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run verify
      - name: Bundled Vercel function is up to date
        run: |
          git status --short
          git diff --stat
          git diff -- src/config/regulations.lock.json src/config/*.generated.* server/**/*.generated.ts | head -60
          git diff --quiet api/index.mjs || { echo "api/index.mjs differs from a fresh build: run npm run build:api and commit"; exit 1; }
      - run: npm run lighthouse
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reports
          path: |
            coverage/
            playwright-report/
            .lighthouseci/
            reports/
          retention-days: 14
