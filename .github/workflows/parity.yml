# Python reference ↔ golden ↔ TypeScript parity (§18.4).
name: parity
on:
  workflow_dispatch:
  push:
    paths: ['kit/**', 'scripts/data/**', 'src/shared/**']
permissions:
  contents: read
jobs:
  parity:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      DATA_INPUTS_RELEASE_TAG: data-inputs-v1
      GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || github.token }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with: { node-version-file: .nvmrc, cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install pandas numpy pyarrow
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils
      - run: npm ci
      - uses: actions/cache@v4
        with:
          path: data/inputs
          key: inputs-${{ hashFiles('kit/manifest/input_files_manifest.json') }}
      - run: npm run data:all
      - run: npm run test:parity
      - run: npm run test:golden
