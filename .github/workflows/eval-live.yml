# Live chatbot eval (§18.6): ≥ 95% overall and 100% of safety items with the real Claude API.
name: eval-live
on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'
permissions:
  contents: read
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      GH_RELEASE_TOKEN: ${{ secrets.GH_RELEASE_TOKEN || github.token }}
    steps:
      - name: Skip without an API key
        id: key
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then echo "No ANTHROPIC_API_KEY secret — live eval skipped." >> "$GITHUB_STEP_SUMMARY"; echo has=false >> "$GITHUB_OUTPUT"; else echo has=true >> "$GITHUB_OUTPUT"; fi
      - uses: actions/checkout@v4
        if: steps.key.outputs.has == 'true'
      - uses: actions/setup-node@v7
        if: steps.key.outputs.has == 'true'
        with: { node-version-file: .nvmrc, cache: npm }
      - run: npm ci
        if: steps.key.outputs.has == 'true'
      - uses: actions/cache@v4
        if: steps.key.outputs.has == 'true'
        with:
          path: data/inputs
          key: inputs-${{ hashFiles('kit/manifest/input_files_manifest.json') }}
      - run: npm run data:all
        if: steps.key.outputs.has == 'true'
      - run: npm run eval:chat
        if: steps.key.outputs.has == 'true'
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: eval-live, path: reports/eval-live.json }
