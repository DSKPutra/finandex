<!doctype html>
<html lang="id" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Finandex — Wawasan Indeks Pasar Keuangan Global</title>
    <meta name="description" content="Finandex — Wawasan Indeks Pasar Keuangan Global (Global Financial Market Indexing Insights). Data historis untuk edukasi, bukan nasihat investasi. © 2026 Dea Saka Kurnia Putra." />
    <meta name="author" content="Dea Saka Kurnia Putra" />

    <style>
      body{margin:0}
      .splash{position:fixed;inset:0;animation:fx-splash .6s ease-in 1.2s forwards;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1.25rem;background:#0a0f0c;z-index:100}
      .splash-by{display:flex;align-items:center;gap:.5rem;font-size:14px;color:#9db0a4}
      html[lang='en'] [data-pre='id'],html:not([lang='en']) [data-pre='en']{display:none}
      [data-theme='light'] .splash{background:#f6f8f7}
      @keyframes fx-splash{to{opacity:0;visibility:hidden}}
    </style>
  </head>
  <body>
    <div id="root">
      <div class="splash" role="status" aria-label="Finandex">
        <img src="/icons/finandex-192.png" width="96" height="96" alt="Finandex" />
        <div class="splash-by"><img src="/brand/dskp-mark-on-dark-64.png" width="24" height="24" alt="" /><span>by Dea Saka Kurnia Putra</span></div>
      </div>
      <!--prerender-->
    </div>
